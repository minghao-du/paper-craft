name: default
version: "1.0.0"
initial_stage: stage_1_plan
target: "End-to-end issue delivery lifecycle"
description: >
  Default issue delivery workflow coordinating workspace preparation, planning,
  implementation, clean code review, code reuse review, landing, verification,
  refactoring, research recording, finalization, and cleanup.
stages:
  - id: workspace_prepare
    logical_task: workspace_prepare
    name: "Workspace Lifecycle Preparation"
    auxiliary: true
    provider:
      type: skill
      target: pc-workspace
      args: []
    description: >
      Prepare and validate the Git execution directory (persistent checkout, isolated
      feature worktree, or pinned detached worktree) required for the target logical stage.

  - id: stage_1_plan
    logical_task: issue_plan
    name: "Stage 1 — Planning and Decomposition"
    provider:
      type: skill
      target: pc-issue-plan
      args: []
    description: >
      Determine whether subissues are needed and establish a filed, dispatch-ready
      execution plan covering root objectives and acceptance criteria.

  - id: stage_2_work
    logical_task: issue_work
    name: "Stage 2.1 — Issue Implementation"
    provider:
      type: skill
      target: pc-issue-work
      args: []
    description: >
      Implement required code/tests for current_issue_id satisfying all acceptance criteria
      under TDD red-green loop and quality standards.

  - id: stage_2_clean_code_review
    logical_task: review_clean_code
    name: "Stage 2.2 — Clean Code Review"
    provider:
      type: skill
      target: pc-review-clean-code
      args: []
    description: >
      Review implementation diff for clean code violations (naming, single responsibility,
      fail-fast, type safety, test quality).

  - id: stage_2_code_reuse_review
    logical_task: review_code_reuse
    name: "Stage 2.3 — Code Reuse Review"
    provider:
      type: skill
      target: pc-review-code-reuse
      args: []
    description: >
      Audit implementation diff for missed reuse of existing constants, helpers, conventions,
      and patterns across affected subsystems.

  - id: stage_2_land
    logical_task: issue_land
    name: "Stage 2.4 — Landing and Merge"
    provider:
      type: skill
      target: pc-pr-land
      args: []
    description: >
      Review, verify pre-merge checks, and land (merge) implementation changes into base branch.

  - id: stage_3_verify
    logical_task: issue_verify
    name: "Stage 3 — Integrated Acceptance Verification"
    provider:
      type: skill
      target: pc-issue-verify
      args: []
    description: >
      Verify every original parent requirement and acceptance threshold against the integrated
      HEAD and combined delivery artifacts.

  - id: stage_4_refactor_audit
    logical_task: pipeline_refactor_audit
    name: "Stage 4.1 — Pipeline Refactoring Audit & Plan"
    provider:
      type: skill
      target: pc-pipeline-refactor
      args: ["--audit"]
    description: >
      Audit touched pipeline scope and generate migration ledger without modifying code
      or filesystem structures.

  - id: stage_4_refactor_execute
    logical_task: pipeline_refactor_execute
    name: "Stage 4.2 — Pipeline Refactoring Execution"
    provider:
      type: skill
      target: pc-pipeline-refactor
      args: ["--execute"]
    description: >
      Execute approved migration ledger atomically under scientific invariance.

  - id: stage_5_redeliver
    logical_task: pipeline_refactor_redeliver
    name: "Stage 5 — Re-delivery of Pipeline Changes"
    provider:
      type: skill
      target: pc-pr-land
      args: []
    description: >
      Deliver and merge refactored pipeline files.

  - id: stage_6_research_record
    logical_task: research_record
    name: "Stage 6 — Research Records and State Finalization"
    provider:
      type: skill
      target: pc-research-state
      args: []
    description: >
      Record final research state, artifact locations, and reproduction entry points.

  - id: issue_finalize
    logical_task: issue_finalize
    name: "Issue Closure and Scope Reconciliation"
    provider:
      type: skill
      target: pc-issue-verify
      args: []
    description: >
      Execute acceptance-backed closure and inventory reconciliation across root and descendants.

  - id: workspace_cleanup
    logical_task: workspace_cleanup
    name: "Workspace Lifecycle Cleanup"
    auxiliary: true
    provider:
      type: skill
      target: pc-workspace
      args: ["--cleanup"]
    description: >
      Remove eligible worktrees and merged task branches belonging to root issue tree.

  - id: scope_replan
    logical_task: scope_replan
    name: "Replanning for Scope Boundaries"
    provider:
      type: skill
      target: pc-issue-plan
      args: ["--replan"]
    description: >
      Scope-reassessment brief and replanning when any stage reports out_of_scope.
